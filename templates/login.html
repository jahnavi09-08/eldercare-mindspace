<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | MindSpace</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-logo">
                🌿
            </div>

            <h1>Welcome to MindSpace</h1>

            <p class="auth-subtitle">
                A gentle space for memory,
                activities and daily routines.
            </p>


            {% if error %}

                <div class="auth-error">
                    {{ error }}
                </div>

            {% endif %}


            <form
                method="POST"
                action="{{ url_for('login') }}"
                class="auth-form"
            >

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    🔐 Login
                </button>

            </form>


            <div class="auth-demo">

                <strong>Demo Account</strong>

                <p>
                    Username: <b>"enter your username"</b>
                </p>

                <p>
                    Password: <b>"enter your password"</b>
                </p>

            </div>


            <div class="auth-register">

                <p>
                    New to MindSpace?
                </p>

                <a href="{{ url_for('register') }}">
                    Create a new account
                </a>

            </div>

        </section>

    </main>

</body>
</html>
