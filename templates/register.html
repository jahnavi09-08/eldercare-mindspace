<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - MindSpace</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<main class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">🌿</div>

            <h1>Create Your Account</h1>

            <p class="auth-subtitle">
                Set up your MindSpace profile
            </p>

            {% if error %}
            <div class="auth-error">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" class="auth-form">

                <label for="name">
                    Your Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    placeholder="Enter your age"
                    min="1"
                    max="120"
                    required
                >

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Enter your password again"
                    minlength="6"
                    required
                >

                <button type="submit" class="auth-button">
                    Create Account
                </button>

            </form>

            <div class="auth-register">

                <p>
                    Already have an account?
                </p>

                <a href="{{ url_for('login') }}">
                    ← Back to Login
                </a>

            </div>

        </div>

    </div>

</main>

</body>
</html>
